<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
    padding: 48px;
  }

  .og-card {
    width: 1200px;
    height: 630px;
    background: #162336;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 120px;
  }

  .og-title {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 116px;
    line-height: 1.05;
    letter-spacing: -0.025em;
    color: #ffffff;
    margin-bottom: 32px;
  }

  .og-rule {
    width: 100px;
    height: 5px;
    background: #b5321c;
    margin-bottom: 32px;
  }

  .og-series {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 42px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35);
  }

  /* Preview labels only */
  .preview-label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    color: #666;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="preview-label">Part 1 — 1200 x 630</div>
<div class="og-card">
  <div class="og-title">Anatomy of a<br>Financial Crisis</div>
  <div class="og-rule"></div>
  <div class="og-series">TRL Crisis Report &mdash; Part 1</div>
</div>

<div class="preview-label">Part 2 — 1200 x 630</div>
<div class="og-card">
  <div class="og-title" style="font-size: 104px;">What Went Wrong<br>&amp; What Comes Next</div>
  <div class="og-rule"></div>
  <div class="og-series">TRL Crisis Report &mdash; Part 2</div>
</div>

</body>
</html>
